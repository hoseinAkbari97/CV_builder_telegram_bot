[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-cv-builder"
version = "0.1.0"
description = "A Telegram bot that guides users through creating a professional CV PDF."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arabic-reshaper>=3.0,<4",
    "httpx>=0.28,<1",
    "pillow>=11,<12",
    "python-dotenv>=1.0,<2",
    "python-bidi>=0.6,<1",
    "python-telegram-bot>=22,<23",
    "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
cv-bot = "cv_bot.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
